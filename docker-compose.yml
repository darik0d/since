# FALLBACK ONLY (primary deploy: Aiven Runtime from the Dockerfile). DB = Aiven PostgreSQL via DATABASE_URL in .env.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/srv/sites:ro      # M1.5: static test sites (nordwind, kallio) copied here
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
